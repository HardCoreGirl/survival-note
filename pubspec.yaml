name: survival_bag_shelter_manager
description: "Survival Bag & Shelter Manager (생존가방 & 피난처 비축 관리기) - Offline-first emergency supply & rolling stock tracker."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  uuid: ^4.4.2
  json_annotation: ^4.9.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  google_sign_in: ^6.2.2
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0

flutter:
  generate: true
  uses-material-design: true
